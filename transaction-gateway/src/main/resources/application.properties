# SwiftPay - Transaction Gateway

spring.application.name=transaction-gateway
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/swiftpay
spring.datasource.username=swiftpay
spring.datasource.password=swiftpay
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# Seed data (data.sql) - runs after Hibernate schema creation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka JSON Serialization

spring.kafka.producer.properties.spring.json.add.type.headers=false

# Actuator / Health

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.swiftpay.gateway.controller
springdoc.paths-to-match=/v1/**