# SwiftPay - Analytics Worker

spring.application.name=analytics-worker
server.port=8082

# ClickHouse
spring.datasource.url=jdbc:clickhouse://localhost:8123/swiftpay_analytics
spring.datasource.username=swiftpay
spring.datasource.password=swiftpay
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.datasource.hikari.maximum-pool-size=5

# Create the analytics table on startup (schema.sql)
spring.sql.init.mode=always

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Consumer
spring.kafka.consumer.group-id=analytics-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.swiftpay.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.swiftpay.analytics.kafka.PaymentCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Actuator / Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.swiftpay.analytics.controller
springdoc.paths-to-match=/v1/**
